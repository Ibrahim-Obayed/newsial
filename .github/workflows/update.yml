name: খবর হালনাগাদ

# চালু হয় বাইরে থেকে: cron-job.org প্রতি ১০ মিনিটে GitHub API-র workflow_dispatch ডাকে (গিটহাবের নিজের cron অনির্ভরযোগ্য)।
# নিচের schedule বাড়তি ভরসা (চললে ভালো, না চললে ক্ষতি নেই)।
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"     # প্রতি ১০ মিনিটে; ০/১০/২০ মিনিটে গিটহাবে ভিড় বেশি, তাই বিজোড় মিনিটে
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: কোড আনা (গোপন রিপোজিটরি, শুধু পড়ার চাবি)
        env:
          KEY: ${{ secrets.CODE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/code_key && chmod 600 ~/.ssh/code_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/code_key -o IdentitiesOnly=yes" git clone --depth 1 git@github.com:Ibrahim-Obayed/newsial-code.git app
          rm -f ~/.ssh/code_key

      - name: আগের ভাণ্ডার ফিরিয়ে আনা (data শাখা)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/data app/site/data
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state
            cp -f state/*.json app/data/ 2>/dev/null || true
          fi
          ls -la app/data

      - name: খবর আনা
        working-directory: app
        run: |
          python3 scripts/fetch_news.py
          python3 scripts/fetch_videos.py || true

      - name: আর্কাইভ (৩০ দিন, archive শাখা; ব্যর্থ হলেও সাইট আপডেট চলবে)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rc=0; git ls-remote --exit-code --heads "$URL" archive >/dev/null 2>&1 || rc=$?
          if [ "$rc" = "0" ]; then git clone -q --depth 1 --branch archive "$URL" arch
          elif [ "$rc" = "2" ]; then mkdir arch
          else echo "ls-remote ব্যর্থ ($rc): আর্কাইভ বাদ, পুরোনো আর্কাইভ অক্ষত"; exit 1; fi
          rm -rf arch/.git
          OUT=$(python3 app/scripts/archive.py app/data/store.json arch | tail -1)
          echo "আর্কাইভ: $OUT"
          if [ "$OUT" = "CHANGED" ]; then
            cd arch
            git init -q -b archive
            git config user.name "newsial-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A && git commit -q -m "আর্কাইভ $(date -u +%FT%TZ)"
            git push -q -f "$URL" archive
          fi

      - name: ভাণ্ডার সংরক্ষণ (সবসময় মাত্র একটা কমিট, ইতিহাস জমে না)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out && mkdir out && cp app/data/*.json out/
          cd out
          git init -q -b data
          git config user.name "newsial-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "ভাণ্ডার $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - name: সাইট সাজানো
        run: |
          rm -rf _site && cp -r app/site _site
          # ক্যাশ ভাঙা: style.css ও app.js-এর ?v= প্রতিবার ফাইলের বিষয়বস্তুর হ্যাশ দিয়ে বসে (বদলালেই নতুন নাম, পুরোনো ক্যাশ আটকায় না)
          for f in style.css app.js; do H=$(sha1sum "_site/$f" | cut -c1-10); sed -i "s#${f}?v=[0-9A-Za-z]*#${f}?v=${H}#g" _site/*.html; done
          grep -ho '\(style.css\|app.js\)?v=[0-9a-f]*' _site/index.html
          ls -la _site _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # গিটহাবের Pages সার্ভার মাঝে মাঝে সাময়িক সাড়া দেয় না ("Fetching artifact metadata failed")।
      # তাই ব্যর্থ হলে একটু থেমে আরও দুবার চেষ্টা; তিনবারই ব্যর্থ হলে তবেই রান ব্যর্থ (ও ইমেইল)।
      - name: সাইট প্রকাশ
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: একটু অপেক্ষা (প্রথম চেষ্টা ব্যর্থ)
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: সাইট প্রকাশ (২য় চেষ্টা)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: একটু অপেক্ষা (২য় চেষ্টাও ব্যর্থ)
        if: steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: সাইট প্রকাশ (৩য় চেষ্টা)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
